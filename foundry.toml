[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Testnet only. RPC/keys are read from the environment at runtime; never hardcoded.
# Populate from .env (see .env.example) — Claude never reads .env.

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

# Named RPC endpoints resolve from env vars at runtime (keyless by default).
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
